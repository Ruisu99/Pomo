<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fokus — Seite blockiert</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, sans-serif;
        background: #0b0f19;
        color: #f4f4f5;
        padding: 2rem;
      }
      .card {
        max-width: 28rem;
        text-align: center;
        border: 1px solid #2a3144;
        border-radius: 1rem;
        padding: 2.5rem 2rem;
        background: #141a28;
      }
      .kicker {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #9ca3af;
        margin-bottom: 0.75rem;
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 0.75rem;
      }
      p {
        color: #9ca3af;
        font-size: 0.95rem;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.75rem 1.25rem;
        border-radius: 0.5rem;
        background: #df3c3c;
        color: #fff;
        text-decoration: none;
        font-weight: 500;
        font-size: 0.9rem;
      }
      a:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="kicker">Pomo Fokusmodus</p>
      <h1>Diese Seite ist blockiert</h1>
      <p>
        Du bist in einer Fokus-Session. YouTube, Social Media und andere Ablenkungen warten
        bis nach der Arbeitsphase.
      </p>
      <a href="javascript:history.back()">Zurück</a>
    </div>
  </body>
</html>
